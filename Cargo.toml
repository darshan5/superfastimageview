[package]
name = "superfastimageview"
version = "0.1.0"
edition = "2024"
description = "A very fast native image viewer with basic editing and batch conversion"
license = "MIT"

[dependencies]
ab_glyph = "0.2.32"
arboard = "3.7.0"
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["wayland", "x11"] }
egui_glow = { version = "0.37", default-features = false }
epaint_default_fonts = "0.37"
fast_image_resize = { version = "6.1.0", features = ["image"] }
glow = "0.17"
glutin = "0.32"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp", "tga", "qoi", "pnm", "hdr", "exr", "dds", "ff", "rayon"] }
natord = "1.0.9"
raw-window-handle = "0.6"
rawler = "0.8.0"
rayon = "1.12.0"
rfd = "0.17.2"
trash = "5.2.9"
turbojpeg = { version = "1.5", default-features = false, features = ["cmake"] }
webp = "0.3.1"
winit = "0.30"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Image decoding is painfully slow unoptimized; optimize deps even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[target."cfg(windows)".dependencies]
mimalloc = "0.1.52"
windows = { version = "0.62", features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_Foundation"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSURL", "NSArray", "NSString"] }
